name: Build v2rayN with Extended Cores

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'v2rayN version tag (e.g. 7.24.4) or "latest"'
        required: true
        default: 'latest'
      create_release:
        description: 'Publish artifacts as a GitHub Release'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event.inputs.version }}" = "latest" ]; then
            V=$(curl -fsSL "https://api.github.com/repos/2dust/v2rayN/releases/latest" | grep -m1 '"tag_name"' | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/')
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved v2rayN version: $V"

      - name: Clone v2rayN @ ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ steps.ver.outputs.version }}" --filter=blob:none --sparse "https://github.com/2dust/v2rayN.git" v2rayN-src
          cd v2rayN-src
          git sparse-checkout set v2rayN

      - name: Apply extended-cores patch
        shell: bash
        run: |
          cd v2rayN-src
          if git apply --whitespace=nowarn ../patches/v2rayN-extended-cores.patch 2>/dev/null; then
            echo "git apply: OK"
          else
            echo "git apply failed, retrying with patch (fuzz) ..."
            patch -p1 --fuzz=3 --batch --forward < ../patches/v2rayN-extended-cores.patch
          fi

      - name: Apply custom cores from cores.user.json
        shell: bash
        run: |
          python scripts/add_custom_cores.py cores.user.json v2rayN-src

      - name: Build ServiceLib.dll
        shell: bash
        run: |
          dotnet build v2rayN-src/v2rayN/ServiceLib/ServiceLib.csproj -c Release -o dist/ServiceLib

      - name: Build full self-contained Windows client
        shell: bash
        run: |
          dotnet publish v2rayN-src/v2rayN/v2rayN/v2rayN.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/v2rayN-Extended

      - name: Package artifacts
        shell: bash
        run: |
          cd dist
          7z a -r "../ServiceLib-extended-${{ steps.ver.outputs.version }}.zip" ServiceLib
          7z a -r "../v2rayN-Extended-win64-SelfContained-${{ steps.ver.outputs.version }}.zip" v2rayN-Extended
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2rayN-extended-${{ steps.ver.outputs.version }}
          path: |
            ServiceLib-extended-${{ steps.ver.outputs.version }}.zip
            v2rayN-Extended-win64-SelfContained-${{ steps.ver.outputs.version }}.zip

      - name: Create release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2rayN-extended-${{ steps.ver.outputs.version }}
          name: v2rayN Extended ${{ steps.ver.outputs.version }}
          files: |
            ServiceLib-extended-${{ steps.ver.outputs.version }}.zip
            v2rayN-Extended-win64-SelfContained-${{ steps.ver.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
